name: beading
description: Приложение для бисероплетения (iOS и macOS).
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  app_links: ^7.0.0
  archive: ^4.6.0
  async: ^2.13.1
  crypto: ^3.0.8
  cupertino_icons: ^1.0.8
  drift: ">=2.30.0 <2.33.0"
  equatable: ^3.0.0
  file_picker: ^13.3.2
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  get_it: ^9.3.0
  go_router: ^17.5.0
  image_picker: ^1.2.4
  intl: ^0.20.2
  package_info_plus: ^10.1.0
  path: ^1.9.1
  path_provider: ^2.1.6
  pdfrx: ^2.4.7
  share_plus: ^13.3.1
  sqlite3: ^2.9.4
  sqlite3_flutter_libs: ^0.5.0
  supabase_flutter: ^2.18.3
  wakelock_plus: ^1.7.0
  window_manager: ^0.5.2
  xml: ^7.0.1

flutter:
  generate: true
  assets:
    - assets/compliments/
    - assets/catalog/

dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: ^10.0.0
  build_runner: ^2.4.0
  mocktail: ^1.0.5
  fake_async: ^1.3.3
  drift_dev: ">=2.30.0 <2.33.0"
