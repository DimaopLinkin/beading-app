publish_to: none
version: 0.0.1+1

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  drift: ">=2.30.0 <2.33.0"
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  get_it: ^9.3.0
  go_router: ^17.5.0
  intl: ^0.20.2
