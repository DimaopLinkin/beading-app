# Раз в день дёргает пустую функцию keep_alive() в Supabase, чтобы бесплатный проект не уходил на паузу (ADR-0006).
# Нужны секреты репозитория: SUPABASE_URL и SUPABASE_PUBLISHABLE_KEY (публичный ключ, не service_role).
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping keep_alive()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::warning::Секреты SUPABASE_URL и SUPABASE_PUBLISHABLE_KEY не заданы, пинг пропущен"
            exit 0
          fi
          status=$(curl -sS -o response.txt -w '%{http_code}' --max-time 30 \
            -X POST "${SUPABASE_URL%/}/rest/v1/rpc/keep_alive" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_PUBLISHABLE_KEY" \
            -H "Content-Type: application/json" -d '{}') || status=000
          echo "HTTP $status"
          if [ "$status" = "200" ]; then
            exit 0
          fi
          if [ "$status" = "540" ] || grep -qi 'paused' response.txt 2>/dev/null; then
            echo "::warning::Проект Supabase на паузе: нажми Resume project в дашборде"
            exit 0
          fi
          cat response.txt || true
          echo "::error::Пинг Supabase не удался (HTTP $status)"
          exit 1
