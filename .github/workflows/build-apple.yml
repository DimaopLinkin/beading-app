name: build-apple

# Минуты macOS в приватном репозитории стоят в 10 раз дороже ubuntu, поэтому
# сборка идёт только при изменении нативной части и вручную (перед релизом).
on:
  pull_request:
    branches: [dev, main]
    paths:
      - ios/**
      - macos/**
      - pubspec.yaml
      - pubspec.lock
      - .github/workflows/build-apple.yml
  workflow_dispatch:

concurrency:
  group: build-apple-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.0
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build macos --debug
      - run: flutter build ios --no-codesign --debug
